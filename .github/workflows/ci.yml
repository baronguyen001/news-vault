name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: python -m pytest

      # The query bar is the whole reading experience, and a filter that matches
      # nothing fails silently. These run the real search.js and layout.js against a
      # stub DOM, no browser required.
      - name: Test browser modules
        run: node --test tests/js/search.test.mjs tests/js/layout.test.mjs tests/js/videos.test.mjs

      # The nightly job's Telegram messages. pwsh is preinstalled on the runner and only the
      # message-composing functions are exercised — the script body is skipped via
      # NEWSVAULT_SOURCING_ONLY, so nothing builds, pushes or reaches the network here.
      - name: Test notification messages
        shell: pwsh
        run: ./scripts/test_notify.ps1

      - name: Build smoke (fixture database, no network)
        run: |
          python -m tests.make_fixture tests/fixtures/sample.db
          NEWSVAULT_PASSWORD=smoke-test-password newsvault build \
            --db tests/fixtures/sample.db \
            --out /tmp/smoke-site \
            --backfill \
            --no-brief
          test -f /tmp/smoke-site/index.html
          test -d /tmp/smoke-site/d
          test -f /tmp/smoke-site/.nojekyll
