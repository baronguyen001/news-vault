name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

      - name: Build smoke (fixture database, no network)
        run: |
          python -m tests.make_fixture tests/fixtures/sample.db
          NEWSVAULT_PASSWORD=smoke-test-password newsvault build \
            --db tests/fixtures/sample.db \
            --out /tmp/smoke-site \
            --backfill \
            --images none \
            --no-brief
          test -f /tmp/smoke-site/index.html
          test -d /tmp/smoke-site/d
          test -f /tmp/smoke-site/.nojekyll
