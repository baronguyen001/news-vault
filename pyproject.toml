[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-vault"
version = "0.5.0"
description = "Build a password-protected static news archive from a news-hunter SQLite database"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "baronguyen001" }]
keywords = ["news", "static-site", "archive", "sqlite", "encryption"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
    "cryptography>=42.0",
    "jinja2>=3.1",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
audio = [
    "edge-tts>=6.1",
]

[project.scripts]
newsvault = "newsvault.cli:main"

[project.urls]
Homepage = "https://github.com/baronguyen001/news-vault"
Issues = "https://github.com/baronguyen001/news-vault/issues"

[tool.setuptools.packages.find]
include = ["newsvault*"]

[tool.setuptools.package-data]
newsvault = ["templates/*.j2", "assets/*.js", "assets/*.css"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
